<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>background-repeat demo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>background-repeat</h1>
      <fieldset>
        <legend>Kies een waarde</legend>
        <label><input type="radio" name="repeat" value="repeat" checked /> repeat</label>
        <label><input type="radio" name="repeat" value="repeat-x" /> repeat-x</label>
        <label><input type="radio" name="repeat" value="repeat-y" /> repeat-y</label>
        <label><input type="radio" name="repeat" value="no-repeat" /> no-repeat</label>
      </fieldset>
      <p>Code: <code id="code">background-repeat: repeat;</code></p>
      <div class="box" id="box"></div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
